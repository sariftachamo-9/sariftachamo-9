<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Vignette effect -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="black" stop-opacity="0" />
      <stop offset="100%" stop-color="black" stop-opacity="0.8" />
    </radialGradient>
    
    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0)" />
      <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.4)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b0e14"/>
  
  <!-- Scanlines overlay -->
  <rect width="800" height="500" fill="url(#scanlines)"/>
  
  <!-- Vignette overlay -->
  <rect width="800" height="500" fill="url(#vignette)"/>

  <style>
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes glitch-red {
      0% { transform: translate(0); opacity: 1; }
      10% { transform: translate(-6px, 3px); opacity: 0.8; }
      20% { transform: translate(6px, -3px); opacity: 1; }
      30% { transform: translate(-12px, 4px); opacity: 0; }
      40% { transform: translate(12px, -4px); opacity: 0.9; }
      50% { transform: translate(-3px, 2px); opacity: 1; }
      60% { transform: translate(3px, -2px); opacity: 0.5; }
      70% { transform: translate(-8px, 5px); opacity: 1; }
      80% { transform: translate(8px, -5px); opacity: 0.8; }
      90% { transform: translate(-4px, 1px); opacity: 1; }
      100% { transform: translate(0); opacity: 1; }
    }
    
    @keyframes glitch-cyan {
      0% { transform: translate(0); opacity: 0; }
      15% { transform: translate(8px, -4px); opacity: 1; }
      30% { transform: translate(-8px, 3px); opacity: 0; }
      45% { transform: translate(16px, -6px); opacity: 0.9; }
      60% { transform: translate(-16px, 6px); opacity: 1; }
      75% { transform: translate(4px, -3px); opacity: 0; }
      90% { transform: translate(-4px, 2px); opacity: 0.8; }
      100% { transform: translate(0); opacity: 0.5; }
    }
    
    @keyframes glitch-base {
      0% { transform: translate(0); opacity: 1; }
      25% { transform: translate(-3px, 2px); opacity: 0; }
      50% { transform: translate(3px, -2px); opacity: 1; }
      75% { transform: translate(-2px, 3px); opacity: 0.5; }
      100% { transform: translate(0); opacity: 1; }
    }
    
    @keyframes glitch-flash {
      0%, 100% { opacity: 0; }
      10% { opacity: 0.8; }
      12% { opacity: 0; }
      20% { opacity: 0.9; }
      22% { opacity: 0; }
      35% { opacity: 0.6; }
      37% { opacity: 0; }
      85% { opacity: 0.5; }
      87% { opacity: 0; }
    }
    
    @keyframes blink {
      from, to { fill-opacity: 1; }
      50% { fill-opacity: 0; }
    }
    
    .line {
      font-family: 'Courier New', monospace;
      font-size: 28px;
      font-weight: bold;
      text-anchor: middle;
      opacity: 0;
    }
    
    .glitch-red {
      animation: fadeInUp 0.8s forwards, glitch-red 0.4s infinite alternate;
    }
    
    .glitch-cyan {
      animation: fadeInUp 0.8s forwards, glitch-cyan 0.5s infinite alternate;
    }
    
    .glitch-base {
      animation: fadeInUp 0.8s forwards, glitch-base 0.3s infinite alternate;
    }
    
    .glitch-flash {
      animation: fadeInUp 0.8s forwards, glitch-flash 3s infinite;
    }
    
    .surprise-text {
      font-size: 36px;
    }
    
    .smile-emoji {
      font-size: 60px;
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
    }
    
    .signature {
      fill: #00ffc8;
      font-size: 24px;
      opacity: 0;
      animation: fadeInUp 1.2s forwards 4s, glitch-base 0.5s infinite alternate 4s;
    }
    
    .cursor {
      animation: blink 0.7s step-end infinite;
    }
  </style>

  <!-- LINE 1: suprise!!! -->
  <g>
    <text x="400" y="100" class="line glitch-flash" fill="#ffffff" style="animation-delay: 0s;">suprise!!!</text>
    <text x="400" y="100" class="line glitch-cyan" fill="#00ffff" style="animation-delay: 0s;">suprise!!!</text>
    <text x="400" y="100" class="line glitch-red" fill="#ff0055" style="animation-delay: 0s;">suprise!!!</text>
    <text x="400" y="100" class="line glitch-base" fill="#ff00c1" style="animation-delay: 0s;">suprise!!!</text>
  </g>

  <!-- LINE 2: suprise!!!! -->
  <g>
    <text x="400" y="155" class="line glitch-flash" fill="#ffffff" style="animation-delay: 0.6s;">suprise!!!!</text>
    <text x="400" y="155" class="line glitch-cyan" fill="#00ffff" style="animation-delay: 0.6s;">suprise!!!!</text>
    <text x="400" y="155" class="line glitch-red" fill="#ff0055" style="animation-delay: 0.6s;">suprise!!!!</text>
    <text x="400" y="155" class="line glitch-base" fill="#ff00c1" style="animation-delay: 0.6s;">suprise!!!!</text>
  </g>

  <!-- LINE 3: i can see you -->
  <g>
    <text x="400" y="220" class="line glitch-flash" fill="#ffffff" style="animation-delay: 1.2s;">i can see you</text>
    <text x="400" y="220" class="line glitch-cyan" fill="#00ffff" style="animation-delay: 1.2s;">i can see you</text>
    <text x="400" y="220" class="line glitch-red" fill="#ff0055" style="animation-delay: 1.2s;">i can see you</text>
    <text x="400" y="220" class="line glitch-base" fill="#00d4b0" style="animation-delay: 1.2s;">i can see you</text>
  </g>

  <!-- LINE 4: and i will find you -->
  <g>
    <text x="400" y="280" class="line glitch-flash" fill="#ffffff" style="animation-delay: 1.9s;">and i will find you</text>
    <text x="400" y="280" class="line glitch-cyan" fill="#00ffff" style="animation-delay: 1.9s;">and i will find you</text>
    <text x="400" y="280" class="line glitch-red" fill="#ff0055" style="animation-delay: 1.9s;">and i will find you</text>
    <text x="400" y="280" class="line glitch-base" fill="#00d4b0" style="animation-delay: 1.9s;">and i will find you</text>
  </g>

  <!-- LINE 5: no matter where you hide from me -->
  <g>
    <text x="400" y="340" class="line glitch-flash" fill="#ffffff" style="animation-delay: 2.6s;">no matter where you hide from me</text>
    <text x="400" y="340" class="line glitch-cyan" fill="#00ffff" style="animation-delay: 2.6s;">no matter where you hide from me</text>
    <text x="400" y="340" class="line glitch-red" fill="#ff0055" style="animation-delay: 2.6s;">no matter where you hide from me</text>
    <text x="400" y="340" class="line glitch-base" fill="#00d4b0" style="animation-delay: 2.6s;">no matter where you hide from me</text>
  </g>

  <!-- Creepy smile emoji -->
  <text x="400" y="410" class="line smile-emoji" fill="#ffaa00" style="animation: fadeInUp 0.8s forwards 3.3s;">😈</text>

  <!-- Blinking cursor at the end -->
  <text x="750" y="340" class="cursor" fill="#00ffc8" font-size="28">|</text>

  <!-- Signature – fades in last with glitch -->
  <text x="650" y="470" class="signature" text-anchor="end">— Master S....</text>

</svg>
