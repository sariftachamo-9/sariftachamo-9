<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0e14"/>

  <style>
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, 3px); }
      80% { transform: translate(2px, -3px); }
      100% { transform: translate(0); }
    }
    @keyframes blink {
      from, to { fill-opacity: 1; }
      50% { fill-opacity: 0; }
    }
    .line {
      fill: #00d4b0;
      font-family: 'Courier New', monospace;
      font-size: 28px;
      font-weight: bold;
      text-anchor: middle;
      opacity: 0;
      animation: fadeInUp 0.8s forwards;
    }
    .glitch {
      animation: fadeInUp 0.8s forwards, glitch 0.3s infinite alternate;
    }
    .surprise {
      fill: #ff00c1;
      font-size: 36px;
    }
    .signature {
      fill: #00ffc8;
      font-size: 24px;
      opacity: 0;
      animation: fadeInUp 1.2s forwards 4s, glitch 0.5s infinite alternate 4s;
    }
    .cursor {
      animation: blink 0.7s step-end infinite;
    }
    .smile {
      font-size: 30px;
      fill: #ffaa00;
    }
  </style>

  <!-- Line 1 -->
  <text x="400" y="100" class="line glitch surprise">suprise!!!</text>
  <!-- Line 2 -->
  <text x="400" y="155" class="line glitch surprise" style="animation-delay: 0.6s;">suprise!!!!</text>
  <!-- Line 3 -->
  <text x="400" y="220" class="line glitch" style="animation-delay: 1.2s;">i can see you</text>
  <!-- Line 4 -->
  <text x="400" y="280" class="line" style="animation-delay: 1.9s;">and i will find you</text>
  <!-- Line 5 -->
  <text x="400" y="340" class="line" style="animation-delay: 2.6s;">no matter where you hide from me</text>
  <!-- Creepy smile -->
  <text x="400" y="400" class="line smile" style="animation-delay: 3.3s;">{creepy smile}</text>

  <!-- Signature – fades in last with glitch -->
  <text x="650" y="470" class="signature" text-anchor="end">— Master S....</text>

  <!-- Blinking cursor at the end of the last line -->
  <text x="430" y="400" class="cursor" fill="#00ffc8" font-size="30">|</text>
</svg>
