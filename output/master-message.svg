<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Hacker Glow -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CRT Scanlines & Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="40%" stop-color="black" stop-opacity="0" />
      <stop offset="100%" stop-color="black" stop-opacity="0.85" />
    </radialGradient>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0)" />
      <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.35)" />
    </pattern>

    <clipPath id="screen-bounds">
      <rect width="800" height="500" />
    </clipPath>

    <!-- Centered Looping One-by-One Typewriter Clipping Paths -->
    <clipPath id="clip-line1">
      <rect x="0" y="100" width="0" height="60">
        <animate attributeName="width" values="0; 800; 800; 0; 0" keyTimes="0; 0.15; 0.5; 0.6; 1" dur="12s" begin="0s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-line2">
      <rect x="0" y="160" width="0" height="60">
        <animate attributeName="width" values="0; 800; 800; 0; 0" keyTimes="0; 0.15; 0.5; 0.6; 1" dur="12s" begin="1.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-line3">
      <rect x="0" y="220" width="0" height="60">
        <animate attributeName="width" values="0; 800; 800; 0; 0" keyTimes="0; 0.15; 0.5; 0.6; 1" dur="12s" begin="3.0s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-line4">
      <rect x="0" y="280" width="0" height="60">
        <animate attributeName="width" values="0; 800; 800; 0; 0" keyTimes="0; 0.15; 0.5; 0.6; 1" dur="12s" begin="4.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-line5">
      <rect x="0" y="340" width="0" height="60">
        <animate attributeName="width" values="0; 800; 800; 0; 0" keyTimes="0; 0.15; 0.5; 0.6; 1" dur="12s" begin="6.0s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b120b" />

  <!-- Matrix Rain Background -->
  <style>
    .rain-col {
      animation: matrix-fall linear infinite;
    }
    .rain-char {
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
    .head { fill: #b3ffd9; opacity: 1; }
    .mid { fill: #00ff41; opacity: 0.6; }
    .tail { fill: #00ff41; opacity: 0.15; }
    @keyframes matrix-fall {
      0% { transform: translateY(-200px); opacity: 0.5; }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      100% { transform: translateY(650px); opacity: 0; }
    }
    
    /* Hacker Cyan Glitch Effect (Rapid flicker) */
    @keyframes glitch-cyan-hacker {
      0%, 90%, 100% { opacity: 0; transform: translate(0) skewX(0deg); }
      10% { opacity: 1; transform: translate(5px, -1px) skewX(2deg); }
      12% { opacity: 0; }
      25% { opacity: 0.8; transform: translate(-6px, 2px) skewX(-2deg); }
      27% { opacity: 0; }
      85% { opacity: 0.6; transform: translate(4px, -2px) skewX(1deg); }
      88% { opacity: 0; }
    }
    .glitch-cyan { animation: glitch-cyan-hacker 4s infinite; }

    /* FIXED Red Glitch Effect (Permanently visible offset to show the "!!!!" and "!!!" you added) */
    @keyframes red-glitch-shift {
      0%, 100% { transform: translate(0) skewX(0deg); }
      15% { transform: translate(-5px, 2px) skewX(-2deg); }
      30% { transform: translate(6px, -2px) skewX(2deg); }
      80% { transform: translate(-4px, 1px) skewX(-1deg); }
    }
    .glitch-red-fixed { 
      animation: red-glitch-shift 4s infinite; 
      fill: #ff0040; 
      filter: url(#neon-glow); 
      opacity: 0.7; /* Constant visible semi-transparent red layer */
    }

    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink-cursor 0.7s step-end infinite; fill: #00ff41; font-family: 'Courier New', monospace; font-size: 28px; font-weight: bold; }
    
    /* BOLD and CAPITALIZED text class */
    .typewriter-text { 
      font-family: 'Courier New', monospace; 
      font-size: 28px; 
      font-weight: bold; 
      fill: #00ff41; 
      filter: url(#neon-glow); 
      text-anchor: middle; 
    }
    
    .signature { font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; fill: #00ffc8; filter: url(#neon-glow); text-anchor: end; opacity: 0; animation: fade-in 1.2s ease-out forwards 8.5s; }
    .smile-emoji { font-size: 50px; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; fill: #ffaa00; filter: url(#neon-glow); text-anchor: middle; opacity: 0; animation: fade-in 0.6s ease-out forwards 8s; }
    @keyframes fade-in { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#screen-bounds)">
    <!-- COLUMN 01 --> <g class="rain-col" style="--d: 0.5s; --s: 24s; animation-delay: var(--d); animation-duration: var(--s);"><text x="20" y="-20" class="rain-char head">9</text><text x="20" y="30" class="rain-char mid">m</text><text x="20" y="80" class="rain-char mid">Q</text><text x="20" y="130" class="rain-char mid">#</text><text x="20" y="180" class="rain-char tail">A</text><text x="20" y="230" class="rain-char tail">3</text><text x="20" y="280" class="rain-char tail">_</text></g>
    <!-- COLUMN 02 --> <g class="rain-col" style="--d: 1.2s; --s: 29s; animation-delay: var(--d); animation-duration: var(--s);"><text x="55" y="-10" class="rain-char head">x</text><text x="55" y="40" class="rain-char mid">7</text><text x="55" y="90" class="rain-char mid">Y</text><text x="55" y="140" class="rain-char mid">@</text><text x="55" y="190" class="rain-char tail">c</text><text x="55" y="240" class="rain-char tail">Z</text><text x="55" y="290" class="rain-char tail">1</text></g>
    <!-- COLUMN 03 --> <g class="rain-col" style="--d: 0.1s; --s: 20s; animation-delay: var(--d); animation-duration: var(--s);"><text x="90" y="-30" class="rain-char head">$</text><text x="90" y="20" class="rain-char mid">w</text><text x="90" y="70" class="rain-char mid">P</text><text x="90" y="120" class="rain-char mid">4</text><text x="90" y="170" class="rain-char tail">F</text><text x="90" y="220" class="rain-char tail">9</text><text x="90" y="270" class="rain-char tail">t</text></g>
    <!-- COLUMN 04 --> <g class="rain-col" style="--d: 2.4s; --s: 31s; animation-delay: var(--d); animation-duration: var(--s);"><text x="125" y="-40" class="rain-char head">b</text><text x="125" y="10" class="rain-char mid">Z</text><text x="125" y="60" class="rain-char mid">%</text><text x="125" y="110" class="rain-char mid">k</text><text x="125" y="160" class="rain-char tail">V</text><text x="125" y="210" class="rain-char tail">8</text><text x="125" y="260" class="rain-char tail">_</text></g>
    <!-- COLUMN 05 --> <g class="rain-col" style="--d: 3.0s; --s: 26s; animation-delay: var(--d); animation-duration: var(--s);"><text x="160" y="-20" class="rain-char head">H</text><text x="160" y="30" class="rain-char mid">2</text><text x="160" y="80" class="rain-char mid">j</text><text x="160" y="130" class="rain-char mid">!</text><text x="160" y="180" class="rain-char tail">r</text><text x="160" y="230" class="rain-char tail">M</text><text x="160" y="280" class="rain-char tail">0</text></g>
    <!-- COLUMN 06 --> <g class="rain-col" style="--d: 0.7s; --s: 22s; animation-delay: var(--d); animation-duration: var(--s);"><text x="195" y="-50" class="rain-char head">3</text><text x="195" y="0" class="rain-char mid">A</text><text x="195" y="50" class="rain-char mid">@</text><text x="195" y="100" class="rain-char mid">w</text><text x="195" y="150" class="rain-char tail">X</text><text x="195" y="200" class="rain-char tail">5</text><text x="195" y="250" class="rain-char tail">u</text></g>
    <!-- COLUMN 07 --> <g class="rain-col" style="--d: 1.8s; --s: 33s; animation-delay: var(--d); animation-duration: var(--s);"><text x="230" y="-10" class="rain-char head">q</text><text x="230" y="40" class="rain-char mid">#</text><text x="230" y="90" class="rain-char mid">9</text><text x="230" y="140" class="rain-char mid">Y</text><text x="230" y="190" class="rain-char tail">B</text><text x="230" y="240" class="rain-char tail">!</text><text x="230" y="290" class="rain-char tail">c</text></g>
    <!-- COLUMN 08 --> <g class="rain-col" style="--d: 3.5s; --s: 24s; animation-delay: var(--d); animation-duration: var(--s);"><text x="265" y="-30" class="rain-char head">N</text><text x="265" y="20" class="rain-char mid">$</text><text x="265" y="70" class="rain-char mid">o</text><text x="265" y="120" class="rain-char mid">7</text><text x="265" y="170" class="rain-char tail">L</text><text x="265" y="220" class="rain-char tail">%</text><text x="265" y="270" class="rain-char tail">z</text></g>
    <!-- COLUMN 09 --> <g class="rain-col" style="--d: 4.2s; --s: 29s; animation-delay: var(--d); animation-duration: var(--s);"><text x="300" y="-60" class="rain-char head">V</text><text x="300" y="-10" class="rain-char mid">x</text><text x="300" y="40" class="rain-char mid">1</text><text x="300" y="90" class="rain-char mid">@</text><text x="300" y="140" class="rain-char tail">G</text><text x="300" y="190" class="rain-char tail">4</text><text x="300" y="240" class="rain-char tail">_</text></g>
    <!-- COLUMN 10 --> <g class="rain-col" style="--d: 1.1s; --s: 18s; animation-delay: var(--d); animation-duration: var(--s);"><text x="335" y="-40" class="rain-char head">6</text><text x="335" y="10" class="rain-char mid">e</text><text x="335" y="60" class="rain-char mid">W</text><text x="335" y="110" class="rain-char mid">$</text><text x="335" y="160" class="rain-char tail">J</text><text x="335" y="210" class="rain-char tail">2</text><text x="335" y="260" class="rain-char tail">a</text></g>
    <!-- COLUMN 11 --> <g class="rain-col" style="--d: 2.7s; --s: 26s; animation-delay: var(--d); animation-duration: var(--s);"><text x="370" y="-20" class="rain-char head">F</text><text x="370" y="30" class="rain-char mid">8</text><text x="370" y="80" class="rain-char mid">p</text><text x="370" y="130" class="rain-char mid">%</text><text x="370" y="180" class="rain-char tail">Q</text><text x="370" y="230" class="rain-char tail">5</text><text x="370" y="280" class="rain-char tail">K</text></g>
    <!-- COLUMN 12 --> <g class="rain-col" style="--d: 0.4s; --s: 31s; animation-delay: var(--d); animation-duration: var(--s);"><text x="405" y="-50" class="rain-char head">d</text><text x="405" y="0" class="rain-char mid">!</text><text x="405" y="50" class="rain-char mid">U</text><text x="405" y="100" class="rain-char mid">3</text><text x="405" y="150" class="rain-char tail">r</text><text x="405" y="200" class="rain-char tail">S</text><text x="405" y="250" class="rain-char tail">7</text></g>
    <!-- COLUMN 13 --> <g class="rain-col" style="--d: 2.9s; --s: 22s; animation-delay: var(--d); animation-duration: var(--s);"><text x="440" y="-10" class="rain-char head">0</text><text x="440" y="40" class="rain-char mid">h</text><text x="440" y="90" class="rain-char mid">X</text><text x="440" y="140" class="rain-char mid">@</text><text x="440" y="190" class="rain-char tail">D</text><text x="440" y="240" class="rain-char tail">1</text><text x="440" y="290" class="rain-char tail">n</text></g>
    <!-- COLUMN 14 --> <g class="rain-col" style="--d: 1.5s; --s: 24s; animation-delay: var(--d); animation-duration: var(--s);"><text x="475" y="-30" class="rain-char head">Z</text><text x="475" y="20" class="rain-char mid">4</text><text x="475" y="70" class="rain-char mid">a</text><text x="475" y="120" class="rain-char mid">!</text><text x="475" y="170" class="rain-char tail">L</text><text x="475" y="220" class="rain-char tail">#</text><text x="475" y="270" class="rain-char tail">9</text></g>
    <!-- COLUMN 15 --> <g class="rain-col" style="--d: 3.8s; --s: 29s; animation-delay: var(--d); animation-duration: var(--s);"><text x="510" y="-60" class="rain-char head">$</text><text x="510" y="-10" class="rain-char mid">g</text><text x="510" y="40" class="rain-char mid">M</text><text x="510" y="90" class="rain-char mid">5</text><text x="510" y="140" class="rain-char tail">C</text><text x="510" y="190" class="rain-char tail">@</text><text x="510" y="240" class="rain-char tail">w</text></g>
    <!-- COLUMN 16 --> <g class="rain-col" style="--d: 0.9s; --s: 35s; animation-delay: var(--d); animation-duration: var(--s);"><text x="545" y="-20" class="rain-char head">y</text><text x="545" y="30" class="rain-char mid">*</text><text x="545" y="80" class="rain-char mid">7</text><text x="545" y="130" class="rain-char mid">%</text><text x="545" y="180" class="rain-char tail">f</text><text x="545" y="230" class="rain-char tail">8</text><text x="545" y="280" class="rain-char tail">P</text></g>
